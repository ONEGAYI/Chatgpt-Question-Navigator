# .coderabbit.yaml
reviews:
  path_filters:
    # 构建产物
    - "!.output/**"
    - "!.wxt/**"
    - "!**/*.lock"
    - "!*.zip"

    # 文档
    - "!docs/**"
    - "!*.md"

    # 工具配置（非业务代码）
    - "!.vscode/**"
    - "!.claude/**"
    - "!.serena/**"
    - "!.gitignore"
    - "!.coderabbit.yaml"
    - "!.pr_agent.toml"

    # 公共资源
    - "!public/**"

    # WXT 框架配置
    - "!wxt.config.ts"
    - "!tsconfig.json"
    - "!package.json"
